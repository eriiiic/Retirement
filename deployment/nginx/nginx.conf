server {
    listen 80;
    server_name FIRECalculator.ai www.FIRECalculator.ai;  # Updated domain name
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name FIRECalculator.ai www.FIRECalculator.ai;
    
    # SSL configuration - replace with your actual paths
    ssl_certificate     /etc/letsencrypt/live/FIRECalculator.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FIRECalculator.ai/privkey.pem;
    
    # Modern SSL configurations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Root directory pointing to your build folder in /home
    root /home;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    
    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Serve the sitemap.xml file
    location = /sitemap.xml {
        access_log off;
    }
    
    # Serve the robots.txt file
    location = /robots.txt {
        access_log off;
    }
    
    # Send all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Specifically target the /home path and its children
    location /home {
        try_files $uri $uri/ /home/index.html;
    }
    
    # Handle 404 errors
    error_page 404 /index.html;
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
} 