
  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Blog Social Card</title>
      <style>
          body {
              margin: 0;
              padding: 0;
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          }
          
          .card {
              width: 1200px;
              height: 630px;
              background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
              color: white;
              padding: 40px;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              position: relative;
              overflow: hidden;
          }
          
          .card::before {
              content: '';
              position: absolute;
              top: 0;
              right: 0;
              width: 400px;
              height: 400px;
              background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
              border-radius: 50%;
              transform: translate(100px, -200px);
          }
          
          .logo {
              font-size: 32px;
              font-weight: bold;
              margin-bottom: 5px;
          }
          
          .logo span {
              color: #4fd1c5;
          }
          
          .title {
              font-size: 64px;
              font-weight: bold;
              margin-bottom: 16px;
              line-height: 1.2;
          }
          
          .description {
              font-size: 32px;
              opacity: 0.9;
              max-width: 800px;
              line-height: 1.4;
              margin-bottom: 40px;
          }
          
          .footer {
              display: flex;
              justify-content: space-between;
              align-items: center;
              font-size: 24px;
              opacity: 0.8;
          }
          
          .icon-grid {
              position: absolute;
              bottom: 80px;
              right: 60px;
              width: 300px;
              height: 300px;
              display: grid;
              grid-template-columns: 1fr 1fr;
              grid-template-rows: 1fr 1fr;
              gap: 20px;
          }
          
          .icon {
              background-color: rgba(255, 255, 255, 0.1);
              border-radius: 16px;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 15px;
          }
          
          .icon svg {
              width: 40px;
              height: 40px;
              fill: #4fd1c5;
          }
      </style>
  </head>
  <body>
      <div class="card">
          <div>
              <div class="logo">FIRE<span>Calculator.ai</span></div>
              <h1 class="title">FIRE Blog & Resources</h1>
              <p class="description">Expert insights on financial independence, retirement strategies, and wealth building</p>
          </div>
          
          <div class="icon-grid">
              <div class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                  </svg>
              </div>
              <div class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                  </svg>
              </div>
              <div class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path d="M4 10h3v7H4zM10.5 10h3v7h-3zM2 19h20v3H2zM17 10h3v7h-3zM12 1L2 6v2h20V6z"/>
                  </svg>
              </div>
              <div class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/>
                  </svg>
              </div>
          </div>
          
          <div class="footer">
              <div class="date">March 2023</div>
              <div class="author">By FIRECalculator Team</div>
          </div>
      </div>
  </body>
  </html>
