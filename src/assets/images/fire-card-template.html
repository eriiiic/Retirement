
  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>FIRE Social Card</title>
      <style>
          body {
              margin: 0;
              padding: 0;
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          }
          
          .card {
              width: 1200px;
              height: 630px;
              background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
              color: white;
              padding: 40px;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              position: relative;
              overflow: hidden;
          }
          
          .card::before {
              content: '';
              position: absolute;
              top: 0;
              right: 0;
              width: 400px;
              height: 400px;
              background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
              border-radius: 50%;
              transform: translate(100px, -200px);
          }
          
          .logo {
              font-size: 32px;
              font-weight: bold;
              margin-bottom: 5px;
          }
          
          .logo span {
              color: #fef3c7;
          }
          
          .title {
              font-size: 64px;
              font-weight: bold;
              margin-bottom: 16px;
              line-height: 1.2;
          }
          
          .description {
              font-size: 32px;
              opacity: 0.9;
              max-width: 800px;
              line-height: 1.4;
              margin-bottom: 40px;
          }
          
          .footer {
              display: flex;
              justify-content: space-between;
              align-items: center;
              font-size: 24px;
              opacity: 0.8;
          }
          
          .fire-illustration {
              position: absolute;
              bottom: 60px;
              right: 60px;
              width: 300px;
              height: 300px;
              display: flex;
              justify-content: center;
              align-items: center;
          }
          
          .fire-icon {
              width: 200px;
              height: 200px;
              position: relative;
          }
          
          .fire-icon::before {
              content: '';
              position: absolute;
              width: 100%;
              height: 100%;
              background: radial-gradient(circle, rgba(255, 208, 86, 0.9) 0%, rgba(255, 152, 0, 0.8) 50%, rgba(255, 111, 0, 0) 100%);
              border-radius: 50%;
              animation: pulse 2s infinite;
          }
          
          @keyframes pulse {
              0% { transform: scale(0.8); opacity: 0.8; }
              50% { transform: scale(1.2); opacity: 1; }
              100% { transform: scale(0.8); opacity: 0.8; }
          }
      </style>
  </head>
  <body>
      <div class="card">
          <div>
              <div class="logo">FIRE<span>Calculator.ai</span></div>
              <h1 class="title">Financial Independence, Retire Early</h1>
              <p class="description">Learn how to achieve financial freedom and retire on your own terms</p>
          </div>
          
          <div class="fire-illustration">
              <div class="fire-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff">
                      <path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/>
                  </svg>
              </div>
          </div>
          
          <div class="footer">
              <div class="date">March 2023</div>
              <div class="author">By FIRECalculator Team</div>
          </div>
      </div>
  </body>
  </html>
