
  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Compound Interest Social Card</title>
      <style>
          body {
              margin: 0;
              padding: 0;
              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          }
          
          .card {
              width: 1200px;
              height: 630px;
              background: linear-gradient(135deg, #059669 0%, #10b981 100%);
              color: white;
              padding: 40px;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              position: relative;
              overflow: hidden;
          }
          
          .card::before {
              content: '';
              position: absolute;
              top: 0;
              right: 0;
              width: 400px;
              height: 400px;
              background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
              border-radius: 50%;
              transform: translate(100px, -200px);
          }
          
          .logo {
              font-size: 32px;
              font-weight: bold;
              margin-bottom: 5px;
          }
          
          .logo span {
              color: #d1fae5;
          }
          
          .title {
              font-size: 64px;
              font-weight: bold;
              margin-bottom: 16px;
              line-height: 1.2;
          }
          
          .description {
              font-size: 32px;
              opacity: 0.9;
              max-width: 800px;
              line-height: 1.4;
              margin-bottom: 40px;
          }
          
          .footer {
              display: flex;
              justify-content: space-between;
              align-items: center;
              font-size: 24px;
              opacity: 0.8;
          }
          
          .chart-illustration {
              position: absolute;
              bottom: 60px;
              right: 60px;
              width: 300px;
              height: 250px;
          }
          
          .curve {
              position: absolute;
              bottom: 0;
              right: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
          }
          
          .curve::after {
              content: '';
              position: absolute;
              width: 300px;
              height: 300px;
              background: rgba(255, 255, 255, 0.2);
              border-radius: 43% 57% 70% 30% / 30% 43% 57% 70%;
              transform: translate(50px, 100px) scale(0.6);
          }
          
          .curve::before {
              content: '';
              position: absolute;
              width: 300px;
              height: 300px;
              background: rgba(255, 255, 255, 0.1);
              border-radius: 43% 57% 70% 30% / 30% 43% 57% 70%;
              transform: translate(0px, 60px) scale(0.8);
          }
      </style>
  </head>
  <body>
      <div class="card">
          <div>
              <div class="logo">FIRE<span>Calculator.ai</span></div>
              <h1 class="title">Compound Interest Calculator</h1>
              <p class="description">Discover the power of compound growth and see how your investments can multiply over time</p>
          </div>
          
          <div class="chart-illustration">
              <div class="curve"></div>
          </div>
          
          <div class="footer">
              <div class="date">March 2023</div>
              <div class="author">By FIRECalculator Team</div>
          </div>
      </div>
  </body>
  </html>
